<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA SPORTS FC 27 - VS Code Edition</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #8b9bb4;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #game-container {
            position: relative;
            display: inline-block;
            border: 4px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }
        canvas {
            background: linear-gradient(135deg, #13381a, #1b4d22);
            display: block;
        }
        .controls-panel {
            margin-top: 15px;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            max-width: 600px;
        }
        button {
            background-color: #00ffcc;
            color: #0b0f19;
            border: none;
            padding: 10px 16px;
            margin: 6px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #00b386;
            transform: translateY(-2px);
        }
        .stats {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>EA SPORTS FC 27</h1>
    <div class="subtitle">Match Engine & PlayStyle Simulator</div>

    <div id="game-container">
        <canvas id="fieldCanvas" width="800" height="400"></canvas>
    </div>

    <div class="controls-panel">
        <div class="stats">
            Match Score: <span id="score" style="color: #00ffcc;">0</span> | Active PlayStyle / Skill: <span id="activeStyle" style="color: #ffcc00;">None</span>
        </div>
        <p style="font-size: 13px; color: #8b9bb4; margin: 6px 0;">Activate an FC 27 feature/skill before releasing your strike into the top bins:</p>
        <button onclick="activatePlayStyle('Rapid')">⚡ Rapid (Speed Boost)</button>
        <button onclick="activatePlayStyle('Finesse')">🎯 Finesse Shot (Curve)</button>
        <button onclick="activatePlayStyle('TikiTaka')">🔄 Tiki-Taka (Quick Build-up)</button>
        <button onclick="takeShot()" style="background-color: #ffcc00; color: #000;">⚽ Strike / Shoot!</button>
    </div>

    <script>
        const canvas = document.getElementById('fieldCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let activePlayStyle = 'None';

        let ball = { x: 100, y: 200, radius: 9, speedX: 0, speedY: 0 };
        let player = { x: 80, y: 200, radius: 14, color: '#ffcc00' };
        let target = { x: 760, y: 130, width: 15, height: 140 };

        function drawField() {
            // Pitch background graphics
            ctx.fillStyle = '#1b4d22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Field lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 3;

            // Halfway line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Penalty Area Box
            ctx.strokeRect(canvas.width - 100, 80, 100, 240);

            // Goal posts
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(target.x, target.y, target.width, target.height);

            // Player avatar
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();
            ctx.closePath();

            // Match ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.closePath();
        }

        function activatePlayStyle(style) {
            activePlayStyle = style;
            document.getElementById('activeStyle').innerText = style;
            
            if (style === 'Rapid') {
                player.x = 180; // Burst forward up the wing
            } else if (style === 'TikiTaka') {
                ball.x = 320; // Quick combination passing lane shift
                ball.y = 200;
            }
        }

        function takeShot() {
            let curveFactor = 0;
            let speedFactor = 13;

            if (activePlayStyle === 'Finesse') {
                curveFactor = -3.5; // Bends the ball toward top/bottom corners
                speedFactor = 10;
            } else if (activePlayStyle === 'Rapid') {
                speedFactor = 17;
            }

            ball.speedX = speedFactor;
            ball.speedY = curveFactor;
        }

        function update() {
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Goal detection check
            if (ball.x >= target.x && ball.y >= target.y && ball.y <= target.y + target.height) {
                score++;
                document.getElementById('score').innerText = score;
                resetPlay();
            }

            // Out-of-bounds reset check
            if (ball.x > canvas.width || ball.y < 0 || ball.y > canvas.height) {
                resetPlay();
            }
        }

        function resetPlay() {
            ball.x = player.x + 15;
            ball.y = player.y;
            ball.speedX = 0;
            ball.speedY = 0;
            activePlayStyle = 'None';
            document.getElementById('activeStyle').innerText = 'None';
            player.x = 80;
        }

        function gameLoop() {
            update();
            drawField();
            requestAnimationFrame(gameLoop);
        }

        resetPlay();
        gameLoop();
    </script>
</body>
</html>
